<style>
/* Layout: one-column phone app. Sticky week header, day-by-day log, bottom tab bar, big "Log care" button. */
:root {
  --bg: #ecf0ed;

  --accent-soft: #e2efe9;
  --extra: #8a5a12;
  --extra-soft: #f6ecd9;
  --good: #2c7a3f;
  --good-soft: #e1f2e4;
  --warn: #9a5b00;
  --warn-soft: #fbecd2;

  --font-body: "Atkinson Hyperlegible", -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  --radius: 14px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101614; --sunk: #151d1a; --shadow: none; --surface: #1c2522; --ink: #e7eeeb; --muted: #9aaaa4; --line: #2c3833;
    --accent: #6cc3a8; --accent-ink: #0d1a16; --accent-soft: #1f3a32;
    --extra: #e2b467; --extra-soft: #3a2f1c;
    --good: #7fd194; --good-soft: #1c3424; --warn: #f0b660; --warn-soft: #3b2e17; --bad: #f08c84; --bad-soft: #3d1f1d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101614; --sunk: #151d1a; --shadow: none; --surface: #1c2522; --ink: #e7eeeb; --muted: #9aaaa4; --line: #2c3833;
  --accent: #6cc3a8; --accent-ink: #0d1a16; --accent-soft: #1f3a32;
  --extra: #e2b467; --extra-soft: #3a2f1c;
  --good: #7fd194; --good-soft: #1c3424; --warn: #f0b660; --warn-soft: #3b2e17; --bad: #f08c84; --bad-soft: #3d1f1d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 18px; line-height: 1.5;

}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

#app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(var(--nav-h) + 96px + env(safe-area-inset-bottom, 0px)); }

header.top {

.group { display: flex; flex-direction: column; gap: 10px; padding: 14px; }

.weeknav .btn { min-height: 52px; padding-inline: 8px; font-size: 1rem; }
.bigbtn { min-height: 60px; font-size: 1.2rem; border-radius: 16px; margin-bottom: 14px; }

.group.pair .btn { flex: 1; min-width: 0; padding-inline: 10px; }
.sheet .stack > .field .chips { gap: 6px; }
.sheet .stack > .field .chip { padding-inline: 12px; }
.dangerzone { margin-top: 30px; padding-top: 18px; border-top: 1px dashed var(--line); display: flex; flex-direction: column; gap: 8px; }
header.top h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.55rem; margin: 0; letter-spacing: -0.01em; flex: 1; min-width: 0; text-wrap: balance; }
header.top .sub { display: block; font-family: var(--font-body); font-weight: 400; font-size: .9rem; color: var(--muted); letter-spacing: 0; }

.iconbtn {
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); display: inline-grid; place-items: center; font-size: 1.2rem; flex: none;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 48px; padding-inline: 18px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 700;

.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-block: 4px 14px; }
.summary.two { grid-template-columns: 1fr 1fr; }
.summary div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; min-width: 0; box-shadow: var(--shadow); }

.summary div.owe { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.summary div.owe span { color: inherit; }
.summary b { display: block; font-family: var(--font-display); font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.summary span { display: block; line-height: 1.25; font-size: .9rem; font-weight: 700; text-transform: none !important; letter-spacing: 0 !important; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

.label { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 1.12rem; color: var(--ink); margin: 30px 0 10px; letter-spacing: -0.005em; }
.label::before { content: ""; flex: none; width: 4px; height: 1.05em; border-radius: 2px; background: var(--accent); }

.clientstrip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 6px; scrollbar-width: none; }
.clientstrip .cs { flex: none; background: var(--accent-soft); border-radius: 999px; padding: 6px 12px; font-size: .92rem; border: 0; }
.clientstrip .cs b { font-variant-numeric: tabular-nums; }

.days { display: flex; flex-direction: column; gap: 10px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.dayhead { display: flex; align-items: center; gap: 12px; padding: 10px 8px 10px 12px; }
.day:not(.empty) .dayhead { border-bottom: 1px solid var(--line); background: var(--sunk); }
.datebox { flex: none; width: 46px; text-align: center; border-radius: 10px; padding: 4px 0; background: var(--accent-soft); color: var(--accent); line-height: 1.1; }
.datebox b { display: block; font-family: var(--font-display); font-size: 1.3rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.datebox span { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.day.today .datebox { background: var(--accent); color: var(--accent-ink); }
.day.empty .datebox { background: var(--sunk); color: var(--muted); width: 40px; padding: 2px 0; }

.dayhead h3 { margin: 0; font-size: 1rem; font-weight: 700; flex: 1; min-width: 0; }

.todaytag { display: inline-block; margin-left: 6px; font-size: .7rem; background: var(--accent); color: var(--accent-ink); padding: 1px 8px; border-radius: 999px; vertical-align: 2px; letter-spacing: .04em; font-weight: 700; }
.day .entry { padding-inline: 14px; }
.day .entry:last-child { border-bottom: 0; }
.entries.card .entry { padding-inline: 14px; }
.entries.card .entry:last-child { border-bottom: 0; }
.addbtn { flex: none; border: 1.5px solid var(--line); background: var(--surface); color: var(--accent); font-weight: 700; border-radius: 999px; min-height: 38px; padding-inline: 14px; font-size: .92rem; }

.entry {
  display: flex; gap: 12px; align-items: center; width: 100%; text-align: left;

}
.entry .what { flex: 1; min-width: 0; }

.entry .meta { color: var(--muted); font-size: .9rem; }
.entry .amt { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.entry .amt small { display: block; color: var(--muted); font-size: .8rem; }
.tag { display: inline-block; font-size: .72rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; letter-spacing: .03em; vertical-align: 1px; }
.tag.extra { background: var(--extra-soft); color: var(--extra); }
.tag.billed { background: var(--accent-soft); color: var(--accent); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.list.card { background: none; border: 0; box-shadow: none; display: flex; flex-direction: column; gap: 10px; }
.list .item {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 14px 14px 18px; box-shadow: inset 5px 0 0 var(--stripe, var(--line)), var(--shadow);
}
.list .item.k-sent { --stripe: var(--accent); }
.list .item.k-part, .list .item.k-todo { --stripe: var(--warn); }
.list .item.k-overdue, .list .item.k-outstanding { --stripe: var(--bad); }
.list .item.k-paid { --stripe: var(--good); }
.list .item .t, .list .item .s { display: block; }
.list .item .t + .s { margin-top: 2px; }
.list .item .r b { display: block; font-size: 1.05rem; margin-bottom: 4px; }
.list .item .t { font-weight: 700; font-size: 1.05rem; }
.list .item .s { color: var(--muted); font-size: .9rem; }
.list .item .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chev { color: var(--muted); }

.pill { display: inline-block; font-size: .78rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill.paid { background: var(--good-soft); color: var(--good); }
.pill.part { background: var(--warn-soft); color: var(--warn); }
.pill.sent { background: var(--accent-soft); color: var(--accent); }
.pill.overdue, .pill.outstanding { background: var(--bad-soft); color: var(--bad); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 44px; padding: 8px 14px; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--surface); font-weight: 700; text-align: left;
}
.chip small { display: block; font-weight: 400; color: var(--muted); font-size: .8rem; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .85; }

.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; min-height: 42px; border-radius: 10px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-weight: 700; font-size: .95rem; }
.field .hint { color: var(--muted); font-size: .85rem; font-weight: 400; }
input[type=text], input[type=number], input[type=date], select, textarea {
  width: 100%; min-height: 48px; border: 1.5px solid var(--line); border-radius: 12px;
  background: var(--surface); padding: 10px 12px;
}
textarea { min-height: 72px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; }
.stepper { display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; }
.stepper input { text-align: center; font-size: 1.3rem; font-weight: 700; }
.stepper button { border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-size: 1.5rem; }
.check { display: flex; gap: 10px; align-items: center; min-height: 44px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }

.fab {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--nav-h) + 14px + env(safe-area-inset-bottom, 0px)); z-index: 6;
  min-height: 56px; padding-inline: 26px; border-radius: 999px; border: 0;
  background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 1.1rem;
  box-shadow: 0 6px 20px rgba(20, 50, 40, .28);
}
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--nav-h); }
nav.tabs { box-shadow: 0 -2px 12px rgba(22, 48, 40, .06); }
nav.tabs button { border: 0; background: none; color: var(--muted); font-size: .8rem; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button svg { box-sizing: content-box; padding: 3px 16px; border-radius: 999px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }

.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgba(10, 20, 16, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--bg); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto;
  border-radius: 20px 20px 0 0; padding-inline: 16px; padding-block: 8px calc(24px + env(safe-area-inset-bottom, 0px));
}
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 6px auto 4px; }
.sheet h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; margin: 6px 0 14px; }
.sheet .actions { display: flex; gap: 10px; margin-top: 8px; position: sticky; bottom: calc(-24px - env(safe-area-inset-bottom, 0px)); z-index: 2; background: var(--bg); margin-inline: -16px; padding-inline: 16px; padding-block: 10px calc(24px + env(safe-area-inset-bottom, 0px)); margin-bottom: calc(-24px - env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.sheet .stack > .field { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px 14px; gap: 10px; box-shadow: var(--shadow); }
.sheet .stack > .field > span:first-child { font-size: 1.05rem; color: var(--ink); }
.sheet .stack > .field > span:first-child .hint { text-transform: none; letter-spacing: 0; }
.sheet .stack > .field .chip:not([aria-pressed="true"]), .sheet .stack > .field .stepper button { background: var(--sunk); }
.sheet .actions .btn { flex: 1; }

.lines { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.lines td { padding: 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.lines td:last-child { text-align: right; white-space: nowrap; padding-left: 10px; }
.lines tr:last-child td { border-bottom: 0; }
.lines tr.total td { font-weight: 700; border-bottom: 0; font-size: 1.05rem; }

.bars { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; align-items: end; height: 110px; padding: 12px 12px 0; }
.bars .b { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; min-width: 0; }
.bars .b i { display: block; width: 100%; max-width: 28px; background: var(--accent); border-radius: 5px 5px 2px 2px; min-height: 2px; }
.bars .b.cur i { background: var(--accent); opacity: 1; }
.bars .b:not(.cur) i { opacity: .55; }
.bars .b span { font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.barlabels { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; padding: 4px 12px 12px; }
.barlabels span { font-size: .7rem; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; }

.welcome { padding-block: 28px; }
.welcome h1 { font-family: var(--font-display); font-weight: 800; font-size: 2rem; margin: 0 0 8px; text-wrap: balance; }
.welcome p { color: var(--muted); margin: 0 0 18px; max-width: 34em; }
.note { background: var(--warn-soft); color: var(--ink); border-radius: 12px; padding: 10px 12px; font-size: .92rem; }
.muted { color: var(--muted); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-weight: 700; font-size: .95rem; text-align: center;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .2);
  max-width: calc(100% - 32px);
}
.syncbar {
  display: flex; gap: 10px; align-items: center; width: 100%; text-align: left;
  background: var(--warn-soft); color: var(--ink); border: 0; border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: .92rem;
}
.syncbar b { color: var(--accent); }
.receipt { display: flex; gap: 12px; align-items: center; }
.thumb { width: 96px; height: 96px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); padding: 0; background: var(--surface); flex: none; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumbs { display: flex; flex-wrap: wrap; gap: 10px; }
.tag.file { border: 1px solid var(--line); color: var(--muted); }
.viewer {
  position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .92);
  display: flex; flex-direction: column; gap: 12px;
  padding-inline: 16px; padding-block: calc(env(safe-area-inset-top, 0px) + 12px) calc(env(safe-area-inset-bottom, 0px) + 16px);
}
.viewer img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
.pdfpages { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; -webkit-overflow-scrolling: touch; }
.pdfpages canvas { width: 100%; max-width: 820px; height: auto; background: #fff; border-radius: 4px; }
.pdfpages p { color: #fff; }
pre.copytext { white-space: pre-wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-family: var(--font-body); font-size: .9rem; margin: 0; max-height: 220px; overflow: auto; }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: rise .22s ease-out; }
  @keyframes rise { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

<script>
(function () {
  "use strict";

  // ---------- storage ----------
  var KEY = "kasHours.v1";
  var state = null;

  function blankState() {
    return { version: 1, clients: [], carers: [], entries: [], invoices: [], settings: { dueDays: 7 }, deleted: [], carersUpdatedAt: 0, settingsUpdatedAt: 0 };
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { state = normalise(JSON.parse(raw)); takeSnapshot(); return; }
    } catch (e) {}
    state = null;
  }
  function normalise(s) {
    var b = blankState();
    s = s || {};
    b.clients = Array.isArray(s.clients) ? s.clients : [];
    b.carers = Array.isArray(s.carers) ? s.carers : [];
    b.entries = Array.isArray(s.entries) ? s.entries : [];
    b.invoices = Array.isArray(s.invoices) ? s.invoices : [];
    b.settings = Object.assign(b.settings, s.settings || {});
    b.deleted = Array.isArray(s.deleted) ? s.deleted : [];
    b.carersUpdatedAt = s.carersUpdatedAt || 0;
    b.settingsUpdatedAt = s.settingsUpdatedAt || 0;
    b.clients.forEach(function (c) { c.rates = Array.isArray(c.rates) ? c.rates : []; if (!c.nextInvoiceNo) c.nextInvoiceNo = 1; });
    b.invoices.forEach(function (i) { i.payments = Array.isArray(i.payments) ? i.payments : []; });
    return b;
  }
  // Every save stamps changed records with updatedAt and records deletions,
  // so two phones syncing through Google Drive can be merged record by record.
  var COLLECTIONS = ["clients", "entries", "invoices"];
  var snap = null;
  function recordKey(r) { var c = Object.assign({}, r); delete c.updatedAt; return JSON.stringify(c); }
  function takeSnapshot() {
    snap = { carers: JSON.stringify(state.carers), settings: JSON.stringify(state.settings) };
    COLLECTIONS.forEach(function (k) { snap[k] = {}; state[k].forEach(function (r) { snap[k][r.id] = recordKey(r); }); });
  }
  function stampChanges() {
    if (!snap) snap = { carers: "[]", settings: "", clients: {}, entries: {}, invoices: {} };
    var now = Date.now(), changed = false;
    COLLECTIONS.forEach(function (k) {
      var seen = {};
      state[k].forEach(function (r) {
        seen[r.id] = true;
        if (snap[k][r.id] !== recordKey(r)) { r.updatedAt = now; changed = true; }
      });
      Object.keys(snap[k]).forEach(function (id) {
        if (!seen[id]) { state.deleted.push({ type: k, id: id, at: now }); changed = true; }
      });
    });
    if (snap.carers !== JSON.stringify(state.carers)) { state.carersUpdatedAt = now; changed = true; }
    if (snap.settings !== JSON.stringify(state.settings)) { state.settingsUpdatedAt = now; changed = true; }
    var cutoff = now - 180 * 864e5;
    state.deleted = state.deleted.filter(function (d) { return d.at > cutoff; });
    return changed;
  }
  function save(opts) {
    var changed = opts && opts.noStamp ? false : stampChanges();
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { toast("Couldn't save on this phone. Make a backup from More."); }
    takeSnapshot();
    if (changed && typeof onLocalChange === "function") onLocalChange();
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  // ---------- receipt photos (IndexedDB: photos are too big for localStorage) ----------
  var photoDB = null, photoCache = {};
  function openDB() {
    if (!photoDB) photoDB = new Promise(function (res, rej) {
      try {
        var r = indexedDB.open("kasHoursPhotos", 1);
        r.onupgradeneeded = function () { r.result.createObjectStore("photos"); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { rej(r.error); };
      } catch (e) { rej(e); }
    });
    return photoDB;
  }
  function photoOp(mode, fn) {
    return openDB().then(function (d) {
      return new Promise(function (res, rej) {
        var tx = d.transaction("photos", mode), req = fn(tx.objectStore("photos"));
        tx.oncomplete = function () { res(req && req.result); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function putPhoto(id, data) { photoCache[id] = data; return photoOp("readwrite", function (st) { st.put(data, id); }); }
  function getPhoto(id) {
    if (photoCache[id]) return Promise.resolve(photoCache[id]);
    return photoOp("readonly", function (st) { return st.get(id); }).then(function (v) { if (v) photoCache[id] = v; return v; });
  }
  function delPhoto(id) { delete photoCache[id]; return photoOp("readwrite", function (st) { st.delete(id); }).catch(function () {}); }
  function clearPhotos() { photoCache = {}; return photoOp("readwrite", function (st) { st.clear(); }).catch(function () {}); }
  function allPhotos() {
    var out = {};
    return photoOp("readonly", function (st) {
      var req = st.openCursor();
      req.onsuccess = function () { var c = req.result; if (c) { out[c.key] = c.value; c.continue(); } };
    }).then(function () { return out; });
  }
  function fillPhotos(root) {
    (root || document).querySelectorAll("img[data-photo]").forEach(function (img) {
      if (img.getAttribute("src")) return;
      getPhoto(img.dataset.photo).then(function (v) { if (v) img.src = v; else img.alt = "Photo missing"; }).catch(function () { img.alt = "Photo missing"; });
    });
  }
  function shrinkImage(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var max = 1400, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error("not an image")); };
      img.src = url;
    });
  }
  function dataURLToFile(data, name) {
    var parts = data.split(","), mime = (parts[0].match(/:(.*?);/) || [])[1] || "image/jpeg", bin = atob(parts[1]), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new File([arr], name, { type: mime });
  }
  function openViewer(src, name) {
    var root = document.getElementById("photo-root");
    root.dataset.src = src; root.dataset.name = name || "receipt.jpg";
    root.innerHTML = '<div class="viewer" data-action="photo-close" role="dialog" aria-label="Receipt photo"><img src="' + src + '" alt="Receipt photo">' +
      '<div class="row"><button class="btn grow" data-action="photo-close">Close</button><button class="btn primary grow" data-action="photo-share">Share</button></div></div>';
  }
  function closeViewer() { var root = document.getElementById("photo-root"); root.innerHTML = ""; delete root.dataset.src; }

  // Invoice PDFs are drawn page by page with PDF.js, so they open the same way on iPhone, Android and computers.
  // Served from the app itself (works offline); the CDN copy is a fallback for the preview page.
  var PDFJS_SOURCES = ["vendor/pdfjs/", "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/"];
  var pdfjsLoading = null;
  function loadPdfJs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    if (!pdfjsLoading) pdfjsLoading = new Promise(function (res, rej) {
      var tryAt = function (i) {
        if (i >= PDFJS_SOURCES.length) { pdfjsLoading = null; rej(new Error("Couldn't load the PDF viewer. Check you're online.")); return; }
        var sc = document.createElement("script");
        sc.src = PDFJS_SOURCES[i] + "pdf.min.js";
        sc.onload = function () { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_SOURCES[i] + "pdf.worker.min.js"; res(window.pdfjsLib); };

      };

    });

  }
  function openPdf(id, name) {
    var root = document.getElementById("photo-root");
    root.dataset.name = name || "invoice.pdf";
    root.innerHTML = '<div class="viewer" role="dialog" aria-label="Invoice PDF"><div class="pdfpages" id="pdf-pages"><p>Opening...</p></div>' +
      '<div class="row"><button class="btn grow" data-action="photo-close">Close</button><button class="btn primary grow" data-action="photo-share" id="pdf-share" disabled>Share</button></div></div>';
    var pages = function () { return document.getElementById("pdf-pages"); };
    getPhoto(id).then(function (data) {
      if (!data) throw new Error("That PDF isn't on this phone yet. Try Sync now.");
      if (!pages()) return;
      root.dataset.src = data;
      document.getElementById("pdf-share").disabled = false;
      var bin = atob(data.split(",")[1]), arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return loadPdfJs().then(function (lib) { return lib.getDocument({ data: arr }).promise; }).then(function (pdf) {
        var box = pages(); if (!box) return;
        box.innerHTML = "";
        var width = Math.min(box.clientWidth || 360, 820), ratio = window.devicePixelRatio || 1, chain = Promise.resolve();

          chain = chain.then(function () { return pdf.getPage(n); }).then(function (page) {

          });
        })(n);
        return chain;
      });
    }).catch(function (e) { var box = pages(); if (box) box.innerHTML = "<p>" + esc(e.message || "Couldn't open that PDF.") + "</p>"; });
  }
  function sharePhoto() {
    var root = document.getElementById("photo-root");
    try {
      var file = dataURLToFile(root.dataset.src, root.dataset.name);
      if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file] }).catch(function () {}); return; }
    } catch (e) {}
    toast("Sharing isn't available here. Press and hold the photo to save it.");
  }

  // ---------- Google Drive sync ----------
  // Paste the OAuth client ID from Google Cloud here. Sync stays hidden while it's empty.
  var GOOGLE_CLIENT_ID = "151579209339-mqhs1s89rjl6fvasqo44g8vh6tckpl7k.apps.googleusercontent.com";
  var SYNC_KEY = "kasHours.sync";
  var DRIVE = "https://www.googleapis.com/drive/v3/";
  var DRIVE_UP = "https://www.googleapis.com/upload/drive/v3/";
  var FOLDER_NAME = "Kas Care Hours", DATA_NAME = "kas-care-hours-data.json";
  var sync = loadSync(), syncBusy = false, syncTimer = null, tokenClient = null, gisLoading = null;

  function loadSync() {
    try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveSync() { try { localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); } catch (e) {} }
  function syncAvailable() { return !!GOOGLE_CLIENT_ID; }
  function tokenValid() { return sync.token && sync.tokenExpires > Date.now() + 60000; }
  function onLocalChange() {
    if (!sync.connected) return;
    sync.dirty = true; saveSync();
    if (tokenValid()) { clearTimeout(syncTimer); syncTimer = setTimeout(function () { runSync(); }, 3000); }
  }

  function loadGIS() {
    if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
    if (gisLoading) return gisLoading;
    gisLoading = new Promise(function (res, rej) {
      var sc = document.createElement("script");
      sc.src = "https://accounts.google.com/gsi/client"; sc.async = true;
      sc.onload = function () { res(); };
      sc.onerror = function () { gisLoading = null; rej(new Error("Couldn't reach Google. Check you're online.")); };
      document.head.appendChild(sc);
    });
    return gisLoading;
  }
  // Must be called from a tap: Google opens a small sign-in popup.
  function signIn() {
    return loadGIS().then(function () {
      return new Promise(function (res, rej) {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_CLIENT_ID,
          scope: "https://www.googleapis.com/auth/drive.file",
          callback: function (r) {
            if (r.error) { rej(new Error("Google sign-in didn't finish.")); return; }
            sync.token = r.access_token; sync.tokenExpires = Date.now() + (r.expires_in || 3600) * 1000;
            sync.connected = true; saveSync(); res();
          },
          error_callback: function () { rej(new Error("Google sign-in was closed before it finished.")); }
        });
        tokenClient.requestAccessToken({ prompt: sync.everConnected ? "" : "consent" });
      });
    });
  }

  function api(url, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ Authorization: "Bearer " + sync.token }, opts.headers || {});
    return fetch(url, opts).then(function (r) {
      if (r.status === 401) { sync.token = null; saveSync(); var e = new Error("Google sign-in expired. Tap Sync to sign in again."); e.auth = true; throw e; }
      if (!r.ok) return r.text().then(function (t) {
        if (/accessNotConfigured|has not been used|SERVICE_DISABLED/.test(t)) throw new Error("Google Drive isn't switched on for this app yet. Ask Tyron to enable the Drive API.");
        if (r.status === 403) throw new Error("Google Drive said no (403). Try Disconnect, then connect again and allow access.");
        throw new Error("Google Drive had a problem (" + r.status + "). Try Sync now again in a minute.");
      });
      return r;
    });
  }
  function q(s) { return encodeURIComponent(s); }
  function findFolder() {
    if (sync.folderId) return Promise.resolve(sync.folderId);
    return api(DRIVE + "files?fields=files(id)&q=" + q("name='" + FOLDER_NAME + "' and mimeType='application/vnd.google-apps.folder' and trashed=false")).then(function (r) { return r.json(); }).then(function (j) {
      if (j.files && j.files.length) return j.files[0].id;
      return api(DRIVE + "files?fields=id", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: FOLDER_NAME, mimeType: "application/vnd.google-apps.folder" }) })
        .then(function (r) { return r.json(); }).then(function (f) { return f.id; });
    }).then(function (id) { sync.folderId = id; saveSync(); return id; });
  }
  function listFolder(folderId) {
    var out = [], page = function (token) {
      return api(DRIVE + "files?pageSize=1000&fields=nextPageToken,files(id,name)&q=" + q("'" + folderId + "' in parents and trashed=false") + (token ? "&pageToken=" + token : ""))
        .then(function (r) { return r.json(); }).then(function (j) { out = out.concat(j.files || []); return j.nextPageToken ? page(j.nextPageToken) : out; });
    };
    return page(null);
  }
  function uploadNew(folderId, name, blob) {
    var boundary = "kasb" + uid(), meta = JSON.stringify({ name: name, parents: [folderId] });
    var body = new Blob(["--" + boundary + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + meta + "\r\n--" + boundary + "\r\nContent-Type: " + (blob.type || "application/octet-stream") + "\r\n\r\n", blob, "\r\n--" + boundary + "--"]);
    return api(DRIVE_UP + "files?uploadType=multipart&fields=id", { method: "POST", headers: { "Content-Type": "multipart/related; boundary=" + boundary }, body: body })
      .then(function (r) { return r.json(); }).then(function (f) { return f.id; });
  }
  function uploadReplace(fileId, blob) {
    return api(DRIVE_UP + "files/" + fileId + "?uploadType=media", { method: "PATCH", headers: { "Content-Type": blob.type || "application/octet-stream" }, body: blob });
  }
  function blobToDataURL(b) { return new Promise(function (res, rej) { var fr = new FileReader(); fr.onload = function () { res(fr.result); }; fr.onerror = rej; fr.readAsDataURL(b); }); }

  function mergeStates(a, b) {
    var out = blankState();
    var deleted = {};
    a.deleted.concat(b.deleted).forEach(function (d) { var k = d.type + ":" + d.id; if (!deleted[k] || deleted[k].at < d.at) deleted[k] = d; });
    out.deleted = Object.keys(deleted).map(function (k) { return deleted[k]; });
    COLLECTIONS.forEach(function (k) {
      var map = {};
      a[k].concat(b[k]).forEach(function (r) { var cur = map[r.id]; if (!cur || (r.updatedAt || 0) > (cur.updatedAt || 0)) map[r.id] = r; });
      out[k] = Object.keys(map).map(function (id) { return map[id]; }).filter(function (r) {
        var d = deleted[k + ":" + r.id]; return !d || d.at < (r.updatedAt || 0);
      });
    });
    var ca = a.carersUpdatedAt >= b.carersUpdatedAt ? a : b; out.carers = ca.carers.slice(); out.carersUpdatedAt = ca.carersUpdatedAt;
    var sa = a.settingsUpdatedAt >= b.settingsUpdatedAt ? a : b; out.settings = Object.assign({}, sa.settings); out.settingsUpdatedAt = sa.settingsUpdatedAt;
    return out;
  }

  function runSync() {
    if (syncBusy || !sync.connected || !tokenValid() || !state) return Promise.resolve();
    syncBusy = true; sync.error = ""; refreshSyncUI();
    var folderId, files;
    return findFolder().then(function (id) { folderId = id; return listFolder(id); }).then(function (list) {
      files = {}; list.forEach(function (f) { files[f.name] = f.id; });
      var dataId = files[DATA_NAME];
      if (!dataId) return null;
      return api(DRIVE + "files/" + dataId + "?alt=media").then(function (r) { return r.json(); }).catch(function (e) { if (e.auth) throw e; return null; });
    }).then(function (remote) {
      if (remote && Array.isArray(remote.clients)) {
        state = normalise(mergeStates(state, normalise(remote)));
        save({ noStamp: true });
      }
      var data = new Blob([JSON.stringify(Object.assign({ app: "kas-care-hours", syncedAt: new Date().toISOString() }, state))], { type: "application/json" });
      return files[DATA_NAME] ? uploadReplace(files[DATA_NAME], data) : uploadNew(folderId, DATA_NAME, data);
    }).then(function () {
      // Receipt photos: upload ones Drive doesn't have, download ones this phone doesn't have.
      // Invoice PDFs the same way.
      var wanted = state.entries.filter(function (e) { return e.photoId; }).map(function (e) { return { id: e.photoId, name: "receipt-" + e.photoId + ".jpg" }; })
        .concat(state.invoices.filter(function (i) { return i.pdfId; }).map(function (i) { return { id: i.pdfId, name: "invoice-" + i.pdfId + ".pdf" }; }));
      var chain = Promise.resolve();
      wanted.forEach(function (w) {
        chain = chain.then(function () { return getPhoto(w.id).catch(function () { return null; }); }).then(function (local) {
          if (local && !files[w.name]) return uploadNew(folderId, w.name, dataURLToFile(local, w.name));
          if (!local && files[w.name]) return api(DRIVE + "files/" + files[w.name] + "?alt=media").then(function (r) { return r.blob(); }).then(blobToDataURL).then(function (d) { return putPhoto(w.id, d); });
        });
      });
      return chain;
    }).then(function () {
      sync.lastSync = Date.now(); sync.dirty = false; sync.everConnected = true; saveSync();
    }).catch(function (e) {
      sync.error = e.message || "Sync didn't finish."; saveSync();
      if (e.message && /404/.test(e.message)) { sync.folderId = null; saveSync(); }
    }).then(function () { syncBusy = false; render(); if (sheet) renderSheet(); });
  }
  function syncNow() {
    var go = tokenValid() ? Promise.resolve() : signIn();
    return go.then(runSync).catch(function (e) { sync.error = e.message; saveSync(); render(); toast(e.message); });
  }
  function refreshSyncUI() { var el = document.getElementById("sync-status"); if (el) el.textContent = syncBusy ? "Syncing..." : syncText(); }
  function ago(t) {
    var m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return "just now"; if (m < 60) return m + " min ago";
    var h = Math.round(m / 60); if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
    return fmtShort(iso(new Date(t)));
  }
  function syncText() {
    if (!sync.connected) return "Not connected";
    if (syncBusy) return "Syncing...";
    if (sync.error) return sync.error;
    return sync.lastSync ? "Last synced " + ago(sync.lastSync) + (sync.dirty ? ", new changes waiting" : "") : "Connected, not synced yet";
  }

  // ---------- helpers ----------
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parse(s) { var p = String(s).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function today() { return iso(new Date()); }
  function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return iso(d); }
  function weekStart(s) { var d = parse(s); var wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return iso(d); }
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var MONTH = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var DAY = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  function ord(n) { var s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
  function fmtShort(s) { var d = parse(s); return d.getDate() + " " + MON[d.getMonth()]; }
  function fmtDay(s) { var d = parse(s); return DAY[d.getDay()] + " " + d.getDate() + " " + MON[d.getMonth()]; }
  function fmtUK(s) { var d = parse(s); return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear(); }
  function money(n) { n = Math.round((+n || 0) * 100) / 100; var neg = n < 0; n = Math.abs(n); var s = n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ","); return (neg ? "-£" : "£") + s; }
  function moneyShort(n) { n = +n || 0; return Number.isInteger(n) ? "£" + n : money(n); }
  function num(n) { n = Math.round((+n || 0) * 100) / 100; return String(n); }
  function hrs(n) { n = +n || 0; return num(n) + (n === 1 ? " hr" : " hrs"); }
  var UNIT = { hour: ["hour", "hours", "hr"], session: ["session", "sessions", "session"], visit: ["visit", "visits", "visit"], fixed: ["item", "items", "item"], night: ["night", "nights", "night"] };
  function unitWord(u, q) { var w = UNIT[u] || UNIT.hour; return q === 1 ? w[0] : w[1]; }
  function qtyText(e) { if (e.unit === "hour") return hrs(e.qty); return num(e.qty) + " " + unitWord(e.unit, +e.qty); }

  function client(id) { return state.clients.find(function (c) { return c.id === id; }); }
  function invoice(id) { return state.invoices.find(function (i) { return i.id === id; }); }
  function clientName(id) { var c = client(id); return c ? c.name : "Unknown client"; }

  function carersBilled(e) { return 1 + (e.billOthers && e.workedWith ? e.workedWith.length : 0); }
  function entryValue(e) {
    if (e.kind === "extra") return +e.amount || 0;
    return (+e.qty || 0) * (+e.price || 0) * carersBilled(e);
  }
  function entryHours(e) { return e.kind === "care" && e.unit === "hour" ? (+e.qty || 0) : 0; }

  function paidSum(inv) { return inv.payments.reduce(function (a, p) { return a + (+p.amount || 0); }, 0); }
  function invStatus(inv) {
    var paid = paidSum(inv), bal = inv.total - paid;
    if (bal <= 0.004) return { key: "paid", text: "Paid" };
    if (inv.outstanding) return { key: "outstanding", text: "Outstanding" };
    if (inv.dueDate && inv.dueDate < today()) return { key: "overdue", text: paid > 0 ? "Part paid, overdue" : "Overdue" };
    if (paid > 0) return { key: "part", text: "Part paid" };
    return { key: "sent", text: "Waiting" };
  }

  function toast(msg) {
    var root = document.getElementById("toast-root");
    root.innerHTML = '<div class="toast" role="status">' + esc(msg) + "</div>";
    clearTimeout(toast.t);
    toast.t = setTimeout(function () { root.innerHTML = ""; }, 2200);
  }
  function copyText(text) {
    var done = function () { toast("Copied. Paste it into your invoice."); };
    try {
      navigator.clipboard.writeText(text).then(done, function () { selectFallback(); });
    } catch (e) { selectFallback(); }
    function selectFallback() {
      var pre = document.querySelector("pre.copytext");
      if (pre) { var r = document.createRange(); r.selectNodeContents(pre); var s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Text selected. Tap Copy."); }
    }
  }

  // ---------- routing ----------
  var view = { name: "week", week: weekStart(today()), id: null, filter: "unpaid" };
  function go(name, id) { view.name = name; view.id = id || null; window.scrollTo(0, 0); render(); }

  // ---------- render ----------
  function render() {
    var app = document.getElementById("app");
    var tabs = document.getElementById("tabs"), fab = document.getElementById("fab");
    if (!state) { tabs.hidden = true; fab.hidden = true; app.innerHTML = renderWelcome(); return; }
    tabs.hidden = false;
    fab.hidden = true;
    var top = view.name === "client" || view.name === "invoice" ? (view.name === "client" ? "clients" : "invoices") : view.name;
    ["week", "clients", "invoices", "more"].forEach(function (n) {
      var b = document.getElementById("nav-" + n);
      if (n === top) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    var html = "";
    if (view.name === "week") html = renderWeek();
    else if (view.name === "clients") html = renderClients();
    else if (view.name === "client") html = renderClient(view.id);
    else if (view.name === "invoices") html = renderInvoices();
    else if (view.name === "invoice") html = renderInvoice(view.id);
    else html = renderMore();
    app.innerHTML = html;
    fillPhotos(app);
  }

  function renderWelcome() {
    return '<div class="welcome">' +
      '<h1>Care hours, logged as you go</h1>' +
      '<p>Add your clients, log each visit when you finish it, and see every client\'s hours by week. When you send an invoice, tick those hours off so you always know what is billed and what has been paid.</p>' +
      '<div class="stack">' +
      '<button class="btn primary block" data-action="start-fresh">Start with my clients</button>' +
      '<button class="btn block" data-action="restore-open">Load a setup or backup file</button>' +
      '<button class="btn block" data-action="start-example">Try it with example clients</button>' +
      (syncAvailable() ? '<p class="muted" style="margin:8px 0 0">Already using it on another phone?</p><button class="btn block" data-action="start-drive">Get my data from Google Drive</button>' : "") +
      '</div></div>';
  }

  function weekEntries(ws) {
    var we = addDays(ws, 6);
    return state.entries.filter(function (e) { return e.date >= ws && e.date <= we; });
  }

  function renderWeek() {
    var ws = view.week, we = addDays(ws, 6), t = today();
    var list = weekEntries(ws);
    var totalH = 0, totalV = 0, extras = 0, byClient = {};
    list.forEach(function (e) {
      totalH += entryHours(e); totalV += entryValue(e); if (e.kind === "extra") extras += entryValue(e);
      var b = byClient[e.clientId] || (byClient[e.clientId] = { h: 0, v: 0, n: 0 });
      b.h += entryHours(e); b.v += entryValue(e); b.n++;
    });
    var isThis = ws === weekStart(t);
    var title = isThis ? "This week" : (ws === addDays(weekStart(t), -7) ? "Last week" : "Week of " + fmtShort(ws));
    var h = '<header class="top"><h1>' + esc(title) + '<span class="sub">' + fmtShort(ws) + " to " + fmtShort(we) + "</span></h1>" +
      (isThis ? "" : '<button class="btn small" data-action="week-today">Back to this week</button>') + "</header>";
    h += '<button class="btn primary block bigbtn" data-action="log-new">+ Log care</button>';
    if (syncAvailable() && sync.connected && (!tokenValid() || sync.error) && (sync.dirty || !sync.lastSync || Date.now() - sync.lastSync > 864e5)) {
      h += '<button class="syncbar" data-action="sync-now"><span class="grow">' + (sync.dirty ? "You have changes not saved to Google Drive." : "Sync with Google Drive to keep both phones up to date.") + "</span><b>Sync</b></button>";
    }
    h += '<div class="summary two"><div class="hi"><b>' + num(totalH) + '</b><span>Hours worked</span></div><div><b>' + money(totalV) + '</b><span>Earned</span></div></div>';
    h += '<div class="days">';
    for (var i = 0; i < 7; i++) {
      var d = addDays(ws, i);
      var de = list.filter(function (e) { return e.date === d; }).sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
      var dh = de.reduce(function (a, e) { return a + entryHours(e); }, 0);
      var dd = parse(d), dv = de.reduce(function (a, e) { return a + entryValue(e); }, 0);
      h += '<section class="day' + (d === t ? " today" : "") + (de.length ? "" : " empty") + '"><div class="dayhead">' +
        '<div class="datebox"><b>' + dd.getDate() + "</b><span>" + DAY[dd.getDay()].slice(0, 3) + "</span></div>" +
        "<h3>" + DAY[dd.getDay()] + (d === t ? '<span class="todaytag">Today</span>' : "") + "<small>" + (de.length ? (dh ? hrs(dh) + " · " : "") + money(dv) : "Nothing logged") + "</small></h3>" +
        "</div>";
      de.forEach(function (e) { h += entryRow(e, false); });
      h += "</section>";
    }
    h += "</div>";
    h += '<div class="weeknav" style="margin-top:16px"><button class="btn" data-action="week-prev">&#8249; Previous week</button><button class="btn" data-action="week-next">Next week &#8250;</button></div>';
    return h;
  }

  function entryRow(e, showDate, hideClient) {
    var meta = [];
    if (showDate) meta.push(fmtShort(e.date));
    if (e.kind === "extra") { if (!hideClient) meta.push(esc(e.description || "Extra")); }
    else { if (!hideClient) meta.push(esc(e.label || "Care")); meta.push(qtyText(e)); }
    if (e.workedWith && e.workedWith.length) meta.push("with " + esc(e.workedWith.join(", ")));
    var tags = "";
    if (e.kind === "extra") tags += ' <span class="tag extra">Extra</span>';
    if (e.photoId) tags += ' <span class="tag file">Receipt</span>';
    if (e.invoiceId) { var inv = invoice(e.invoiceId); if (inv) tags += ' <span class="tag billed">Inv ' + esc(inv.number) + "</span>"; }
    var sub = e.kind === "care" && carersBilled(e) > 1 ? "<small>" + carersBilled(e) + " carers</small>" : (e.note ? "<small>note</small>" : "");
    return '<button class="entry" data-action="edit-entry" data-id="' + e.id + '">' +
      '<span class="what"><span class="who">' + (hideClient ? (e.kind === "extra" ? esc(e.description || "Extra") : esc(e.label || "Care")) : esc(clientName(e.clientId))) + "</span>" + tags +
      '<br><span class="meta">' + meta.join(" · ") + "</span></span>" +
      '<span class="amt">' + money(entryValue(e)) + sub + "</span></button>";
  }

  function unbilled(cid) { return state.entries.filter(function (e) { return e.clientId === cid && !e.invoiceId; }); }

  function renderClients() {
    var active = state.clients.filter(function (c) { return !c.archived; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
    var archived = state.clients.filter(function (c) { return c.archived; });
    var h = '<header class="top"><h1>Clients</h1><button class="btn small primary" data-action="client-new">+ Add client</button></header>';
    if (!active.length) h += '<p class="muted">No clients yet. Add your first client to start logging hours.</p>';
    else {
      h += '<div class="list card">' + active.map(function (c) {
        var u = unbilled(c.id), uh = 0, uv = 0;
        u.forEach(function (e) { uh += entryHours(e); uv += entryValue(e); });
        var rates = c.rates.map(function (r) { return moneyShort(r.price) + "/" + (UNIT[r.unit] || UNIT.hour)[2]; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).join(", ");
        return '<button class="item' + (u.length ? " k-todo" : "") + '" data-action="open-client" data-id="' + c.id + '"><span class="grow"><span class="t">' + esc(c.name) + "</span>" +
          '<span class="s">' + (c.careFor ? "Care for " + esc(c.careFor) + " · " : "") + esc(rates || "No rates yet") + "</span></span>" +
          '<span class="r">' + (u.length ? "<b>" + money(uv) + '</b><span class="s">' + (uh ? hrs(uh) + " " : "") + "to invoice</span>" : '<span class="s">All invoiced</span>') + "</span>" +
          '<span class="chev">&#8250;</span></button>';
      }).join("") + "</div>";
    }
    if (archived.length) {
      h += '<div class="label">Past clients</div><div class="list card">' + archived.map(function (c) {
        return '<button class="item" data-action="open-client" data-id="' + c.id + '"><span class="grow"><span class="t">' + esc(c.name) + '</span></span><span class="chev">&#8250;</span></button>';
      }).join("") + "</div>";
    }
    return h;
  }

  function renderClient(id) {
    var c = client(id);
    if (!c) return '<p>Client not found.</p>';
    var u = unbilled(id).sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var uh = 0, uv = 0; u.forEach(function (e) { uh += entryHours(e); uv += entryValue(e); });
    var h = '<header class="top"><button class="iconbtn" data-nav="clients" aria-label="Back to clients">&#8249;</button><h1>' + esc(c.name) +
      '<span class="sub">' + (c.careFor ? "Care for " + esc(c.careFor) : "Next invoice No. " + pad3(c.nextInvoiceNo)) + "</span></h1>" +
      '<button class="btn small" data-action="client-edit" data-id="' + id + '">Edit</button></header>';
    h += '<div class="summary"><div><b>' + num(uh) + '</b><span>Hours not invoiced</span></div><div class="' + (uv ? "hi" : "") + '"><b>' + moneyShort(Math.round(uv)) + '</b><span>To invoice</span></div><div><b>' + pad3(c.nextInvoiceNo) + '</b><span>Next No.</span></div></div>';
    // last 8 weeks
    var ws0 = weekStart(today()), weeks = [];
    for (var i = 7; i >= 0; i--) {
      var ws = addDays(ws0, -7 * i), we = addDays(ws, 6);
      var hh = state.entries.filter(function (e) { return e.clientId === id && e.date >= ws && e.date <= we; }).reduce(function (a, e) { return a + entryHours(e); }, 0);
      weeks.push({ ws: ws, h: hh });
    }
    var max = Math.max.apply(null, weeks.map(function (w) { return w.h; }).concat([1]));
    h += '<div class="label">Hours per week</div><div class="card"><div class="bars">' + weeks.map(function (w, i) {
      return '<div class="b' + (i === 7 ? " cur" : "") + '"><span>' + (w.h ? num(w.h) : "") + '</span><i style="height:' + Math.round((w.h / max) * 80) + 'px"></i></div>';
    }).join("") + '</div><div class="barlabels">' + weeks.map(function (w, i) { var d0 = parse(w.ws); return "<span>" + (i === 7 ? "Now" : d0.getDate() + "/" + (d0.getMonth() + 1)) + "</span>"; }).join("") + "</div></div>";
    h += '<div class="stack" style="margin-top:14px"><button class="btn primary block bigbtn" style="margin:0" data-action="log-new">+ Log care for ' + esc(c.name) + '</button><button class="btn block" data-action="mark-invoiced" data-id="' + id + '"' + (u.length ? "" : " disabled") + '>Mark hours as invoiced</button></div>';
    h += '<div class="label">Not invoiced yet (' + u.length + ")</div>";
    if (!u.length) h += '<p class="muted">Everything logged for ' + esc(c.name) + " is on an invoice.</p>";
    else h += '<div class="card entries">' + u.slice().reverse().map(function (e) { return entryRow(e, true, true); }).join("") + "</div>";
    var invs = state.invoices.filter(function (iv) { return iv.clientId === id; }).sort(function (a, b) { return b.date < a.date ? -1 : 1; });
    h += '<div class="label">Invoices</div>';
    if (!invs.length) h += '<p class="muted">No invoices recorded yet.</p>';
    else h += '<div class="list card">' + invs.map(function (iv) { return invoiceRow(iv, true); }).join("") + "</div>";
    return h;
  }
  function pad3(n) { n = String(n); while (n.length < 3) n = "0" + n; return n; }

  function invoiceRow(inv, onClient) {
    var st = invStatus(inv), bal = inv.total - paidSum(inv);
    return '<button class="item k-' + st.key + '" data-action="open-invoice" data-id="' + inv.id + '"><span class="grow"><span class="t">' + (onClient === true ? "No. " + esc(inv.number) : esc(clientName(inv.clientId))) + "</span>" +
      '<span class="s">' + (onClient === true ? "Sent " : "No. " + esc(inv.number) + " · ") + fmtShort(inv.date) + (inv.pdfId ? ' <span class="tag file">PDF</span>' : "") + "</span>" +
      (inv.from ? '<span class="s">Covers ' + fmtShort(inv.from) + " to " + fmtShort(inv.to) + "</span>" : "") + "</span>" +
      '<span class="r"><b>' + money(inv.total) + '</b><span class="pill ' + st.key + '">' + (st.key === "paid" ? "Paid" : st.key === "part" ? money(bal) + " left" : st.text) + "</span></span></button>";
  }

  function renderInvoices() {
    var all = state.invoices.slice().sort(function (a, b) { return b.date < a.date ? -1 : b.date > a.date ? 1 : 0; });
    var owed = 0; all.forEach(function (i) { var b = i.total - paidSum(i); if (b > 0) owed += b; });
    var f = view.filter;
    var shown = all.filter(function (i) {
      var k = invStatus(i).key;
      if (f === "unpaid") return k !== "paid";
      if (f === "paid") return k === "paid";
      return true;
    });
    var h = '<header class="top"><h1>Invoices<span class="sub">Money owed to you: <b class="num">' + money(owed) + "</b></span></h1></header>";
    h += '<div class="chips" style="margin-bottom:12px">' + [["unpaid", "Not paid"], ["paid", "Paid"], ["all", "All"]].map(function (x) {
      return '<button class="chip" data-action="inv-filter" data-f="' + x[0] + '" aria-pressed="' + (f === x[0]) + '">' + x[1] + "</button>";
    }).join("") + "</div>";
    if (!all.length) h += '<p class="muted">When you send an invoice, open the client and tap "Mark hours as invoiced". It will show up here so you can track payment.</p>';
    else if (!shown.length) h += '<p class="muted">Nothing here.</p>';
    else h += '<div class="list card">' + shown.map(invoiceRow).join("") + "</div>";
    return h;
  }

  function invoiceLines(entries) {
    var groups = {}, order = [];
    entries.forEach(function (e) {
      var k = e.kind === "extra" ? "x:" + e.id : "c:" + (e.label || "") + "|" + e.price + "|" + e.unit;
      if (!groups[k]) { groups[k] = { kind: e.kind, label: e.kind === "extra" ? (e.description || "Extra") : (e.label || "Care"), unit: e.unit, price: e.price, qty: 0, total: 0, date: e.date }; order.push(k); }
      var g = groups[k];
      if (e.kind === "extra") g.total += entryValue(e);
      else { g.qty += (+e.qty || 0) * carersBilled(e); g.total += entryValue(e); }
    });
    return order.map(function (k) { return groups[k]; }).sort(function (a, b) { return a.kind === b.kind ? 0 : a.kind === "care" ? -1 : 1; });
  }

  function breakdownText(c, entries, from, to) {
    var es = entries.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    var out = ["Care for " + (c.careFor || c.name) + " (" + fmtUK(from) + " - " + fmtUK(to) + "):"];
    var lastMonth = "";
    var care = es.filter(function (e) { return e.kind === "care"; });
    care.forEach(function (e) {
      var d = parse(e.date), m = MONTH[d.getMonth()];
      if (m !== lastMonth) { out.push(m + ":"); lastMonth = m; }
      var q = e.unit === "hour" ? num(e.qty) + (+e.qty === 1 ? " hour" : " hours") : num(e.qty) + " " + unitWord(e.unit, +e.qty);
      var cb = carersBilled(e);
      out.push(ord(d.getDate()) + " - " + q + (cb > 1 ? " x " + cb + " carers" : "") + (e.label ? " (" + e.label + ")" : ""));
    });
    var extras = es.filter(function (e) { return e.kind === "extra"; });
    if (extras.length) {
      out.push("Extras:");
      extras.forEach(function (e) { out.push(ord(parse(e.date).getDate()) + " " + MON[parse(e.date).getMonth()] + " - " + (e.description || "Extra") + " - " + money(e.amount)); });
    }
    var lines = invoiceLines(es), total = 0;
    out.push("");
    lines.forEach(function (l) {
      total += l.total;
      if (l.kind === "care") out.push(l.label + ": " + num(l.qty) + " " + unitWord(l.unit, l.qty) + " x " + moneyShort(l.price) + " = " + money(l.total));
    });
    if (extras.length) out.push("Extras: " + money(extras.reduce(function (a, e) { return a + entryValue(e); }, 0)));
    out.push("Total: " + money(total));
    return out.join("\n");
  }

  function renderInvoice(id) {
    var inv = invoice(id);
    if (!inv) return "<p>Invoice not found.</p>";
    var c = client(inv.clientId), st = invStatus(inv), paid = paidSum(inv), bal = inv.total - paid;
    var h = '<header class="top"><button class="iconbtn" data-action="invoice-back" aria-label="Back">&#8249;</button><h1>No. ' + esc(inv.number) + '<span class="sub">' + esc(c ? c.name : "") + " · " + fmtUK(inv.date) + "</span></h1>" +
      '<span class="pill ' + st.key + '">' + st.text + "</span></header>";
    h += '<div class="summary"><div><b>' + moneyShort(inv.total) + '</b><span>Invoiced</span></div><div><b>' + moneyShort(paid) + '</b><span>Paid</span></div><div class="' + (bal > 0.004 ? "owe" : "hi") + '"><b>' + moneyShort(Math.max(bal, 0)) + '</b><span>Still owed</span></div></div>';
    h += '<p class="muted" style="margin:0">Covers ' + (inv.from ? fmtShort(inv.from) + " to " + fmtShort(inv.to) : "this period") + ". Due " + (inv.dueDate ? fmtUK(inv.dueDate) : "on receipt") + ".</p>";
    if (inv.pdfId) h += '<button class="btn primary block" style="margin-top:12px" data-action="pdf-open" data-id="' + esc(inv.pdfId) + '" data-name="' + esc(clientName(inv.clientId) + " invoice " + inv.number + ".pdf") + '">Open invoice PDF</button>';
    if (inv.note) h += inv.outstanding ? '<p class="note">' + esc(inv.note) + "</p>" : '<p class="muted" style="font-size:.9rem">' + esc(inv.note) + "</p>";
    h += '<div class="label">Lines</div><div class="card" style="padding:4px 14px"><table class="lines"><tbody>' +
      (inv.lines || []).map(function (l) {
        return "<tr><td>" + esc(l.label) + (l.kind === "care" ? '<br><span class="muted">' + num(l.qty) + " " + unitWord(l.unit, l.qty) + " x " + moneyShort(l.price) + "</span>" : ' <span class="tag extra">Extra</span>') + "</td><td>" + money(l.total) + "</td></tr>";
      }).join("") + '<tr class="total"><td>Total</td><td>' + money(inv.total) + "</td></tr></tbody></table></div>";
    var receipts = state.entries.filter(function (e) { return e.invoiceId === inv.id && e.photoId; });
    if (receipts.length) {
      h += '<div class="label">Receipts</div><div class="thumbs">' + receipts.map(function (e) {
        return '<button class="thumb" data-action="photo-open" data-id="' + esc(e.photoId) + '" data-name="' + esc((e.description || "receipt") + " " + e.date + ".jpg") + '" aria-label="Receipt: ' + esc(e.description) + '"><img alt="" data-photo="' + esc(e.photoId) + '"></button>';
      }).join("") + "</div>";
    }
    h += '<div class="label">Payments</div><div class="card">';
    if (!inv.payments.length) h += '<p class="muted" style="margin:0;padding:14px 14px 0">No payments recorded yet.</p>';
    else h += '<div style="padding:4px 14px"><table class="lines"><tbody>' + inv.payments.map(function (p, i) {
      return "<tr><td>" + fmtUK(p.date) + (p.note ? '<br><span class="muted">' + esc(p.note) + "</span>" : "") + ' <button class="linkbtn" data-action="pay-remove" data-id="' + inv.id + '" data-i="' + i + '">Remove</button></td><td>' + money(p.amount) + "</td></tr>";
    }).join("") + "</tbody></table></div>";
    if (bal > 0.004) h += '<div class="group pair"><button class="btn primary grow" data-action="pay-full" data-id="' + inv.id + '">Paid in full</button><button class="btn grow" data-action="pay-open" data-id="' + inv.id + '">Part paid</button></div>';
    else h += '<div style="height:10px"></div>';
    h += "</div>";
    h += '<details class="more"><summary>More options for this invoice</summary><div class="card group">';
    h += '<button class="btn block" data-action="inv-outstanding" data-id="' + inv.id + '">' + (inv.outstanding ? "Edit outstanding note" : "Mark as outstanding, with a note") + "</button>";

  // ---------- sheets ----------
  var sheet = null; // { type, data }
  function openSheet(type, data) { sheet = { type: type, data: data || {} }; renderSheet(); }
  function closeSheet() { sheet = null; document.getElementById("sheet-root").innerHTML = ""; }
  function renderSheet() {
    var root = document.getElementById("sheet-root");
    if (!sheet) { root.innerHTML = ""; return; }
    var inner = "";
    if (sheet.type === "entry") inner = sheetEntry();
    else if (sheet.type === "client") inner = sheetClient();
    else if (sheet.type === "invoice") inner = sheetInvoice();
    else if (sheet.type === "payment") inner = sheetPayment();
    else if (sheet.type === "outstanding") inner = sheetOutstanding();
    else if (sheet.type === "copy") inner = sheetCopy();
    else if (sheet.type === "restore") inner = sheetRestore();
    else if (sheet.type === "backup") inner = sheetBackup();
    var scroll = root.querySelector(".sheet") ? root.querySelector(".sheet").scrollTop : 0;
    root.innerHTML = '<div class="sheet-wrap" data-action="sheet-bg"><div class="sheet" role="dialog" aria-modal="true">' + inner.replace(/^<h2>([\s\S]*?)<\/h2>/, '<div class="sheettop"><h2>$1</h2><button class="closebtn" data-action="sheet-close">&#10005; Close</button></div>') + "</div></div>";
    var s = root.querySelector(".sheet"); if (s) s.scrollTop = scroll;
    fillPhotos(root);
  }

  // Entry sheet
  function newEntryDraft(date, clientId) {
    var last = state.entries.slice().sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); })[0];
    var cid = clientId || (last ? last.clientId : (state.clients.find(function (c) { return !c.archived; }) || {}).id);
    var d = { id: null, kind: "care", clientId: cid || null, date: date || today(), rateId: null, qty: 1, workedWith: [], billOthers: false, description: "", amount: "", note: "" };
    applyClientDefaults(d);
    return d;
  }
  function applyClientDefaults(d) {
    var c = d.clientId && client(d.clientId);
    if (!c) { d.rateId = null; return; }
    if (!c.rates.find(function (r) { return r.id === d.rateId; })) {
      var prev = state.entries.filter(function (e) { return e.clientId === c.id && e.kind === "care"; }).sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); })[0];
      d.rateId = prev && c.rates.find(function (r) { return r.id === prev.rateId; }) ? prev.rateId : (c.rates[0] ? c.rates[0].id : null);
      if (prev && !d.id) { d.qty = prev.qty; d.workedWith = (prev.workedWith || []).slice(); d.billOthers = !!prev.billOthers; }
    }
  }
  function sheetEntry() {
    var d = sheet.data, c = d.clientId && client(d.clientId);

    h += '<div class="seg" role="group" aria-label="Type"><button data-action="e-kind" data-v="care" aria-pressed="' + (d.kind === "care") + '">Hours worked</button><button data-action="e-kind" data-v="extra" aria-pressed="' + (d.kind === "extra") + '">Money spent</button></div>';
    if (!clients.length) h += '<p class="note">Add a client first, on the Clients tab.</p>';
    h += '<div class="field"><span>Who for?</span><div class="chips">' + clients.map(function (x) {
      return '<button class="chip" data-action="e-client" data-id="' + x.id + '" aria-pressed="' + (x.id === d.clientId) + '">' + esc(x.name) + "</button>";
    }).join("") + "</div></div>";
    var yest = addDays(today(), -1);

    if (d.kind === "care") {
      if (c) {
        if (!c.rates.length) h += '<p class="note">' + esc(c.name) + ' has no rates yet. <button class="linkbtn" data-action="client-edit" data-id="' + c.id + '">Add a rate</button></p>';
        else if (c.rates.length > 1) h += '<div class="field"><span>Which kind?</span><div class="chips">' + c.rates.map(function (r) {
          return '<button class="chip" data-action="e-rate" data-id="' + r.id + '" aria-pressed="' + (r.id === d.rateId) + '">' + esc(r.label) + "<small>" + moneyShort(r.price) + " per " + (UNIT[r.unit] || UNIT.hour)[0] + "</small></button>";
        }).join("") + "</div></div>";
      }
      var rate = c && c.rates.find(function (r) { return r.id === d.rateId; });
      var unit = rate ? rate.unit : "hour";
      h += '<div class="field"><span>' + (unit === "hour" ? "How many hours?" : "How many " + unitWord(unit, 2) + "?") + '</span><div class="stepper"><button data-action="e-step" data-v="-1" aria-label="Less">&minus;</button><input type="number" id="e-qty" inputmode="decimal" step="0.25" min="0" value="' + esc(d.qty) + '"><button data-action="e-step" data-v="1" aria-label="More">+</button></div>' +
        (unit === "hour" ? '<div class="chips">' + [0.5, 1, 1.5, 2, 3, 4].map(function (q) { return '<button class="chip" data-action="e-qty" data-v="' + q + '" aria-pressed="' + (+d.qty === q) + '">' + num(q) + "</button>"; }).join("") + "</div>" : "") + "</div>";
      h += '<div class="field"><span>Anyone with you? <span class="hint">(leave blank if not)</span></span><div class="chips">' + state.carers.map(function (n) {
        return '<button class="chip" data-action="e-with" data-v="' + esc(n) + '" aria-pressed="' + (d.workedWith.indexOf(n) >= 0) + '">' + esc(n) + "</button>";
      }).join("") + '<button class="chip" data-action="e-with-add">+ Add a name</button></div>';
      if (d.addingCarer) h += '<div class="row"><input type="text" id="e-carer-new" placeholder="Their name" autocomplete="off"><button class="btn" data-action="e-with-save">Add</button></div>';
      if (d.workedWith.length) h += '<label class="check"><input type="checkbox" id="e-billothers"' + (d.billOthers ? " checked" : "") + '> Charge for ' + (d.workedWith.length === 1 ? "both carers" : "all " + (d.workedWith.length + 1) + " carers") + " (double-up call)</label>";
      h += "</div>";
      if (rate) {
        var tmp = { kind: "care", qty: d.qty, price: rate.price, unit: rate.unit, workedWith: d.workedWith, billOthers: d.billOthers };
        h += '<p class="totalbar"><span>Comes to</span><b class="num" id="e-total">' + money(entryValue(tmp)) + "</b></p>";
      }
    } else {
      h += '<div class="field"><span>What did you pay for?</span><input type="text" id="e-desc" value="' + esc(d.description) + '" placeholder="e.g. Food shopping" autocomplete="off"><div class="chips">' +
        ["Food shopping", "Hospital visit", "Prescription", "Taxi or fuel"].map(function (s) { return '<button class="chip" data-action="e-desc" data-v="' + s + '">' + s + "</button>"; }).join("") + "</div></div>";
      h += '<div class="field"><span>How much? (£)</span><input type="number" id="e-amount" inputmode="decimal" step="0.01" min="0" value="' + esc(d.amount) + '" placeholder="0.00"></div>';
      h += '<div class="field"><span>Receipt photo <span class="hint">(optional)</span></span>';
      if (d.photoData || d.photoId) {
        h += '<div class="receipt"><button class="thumb" data-action="e-photo-view" aria-label="View receipt"><img alt="Receipt" ' + (d.photoData ? 'src="' + d.photoData + '"' : 'data-photo="' + esc(d.photoId) + '"') + '></button>' +
          '<div class="stack grow"><label class="btn small" for="e-photo">Replace photo</label><button class="btn small" data-action="e-photo-remove">Remove photo</button></div></div>';
      } else h += '<label class="btn block" for="e-photo">' + (d.photoBusy ? "Adding photo..." : "Take or choose a photo") + "</label>";
      h += '<input type="file" id="e-photo" accept="image/*" hidden></div>';
    }
    if (d.note || d.showNote) h += '<label class="field"><span>Note <span class="hint">(only you see this)</span></span><textarea id="e-note">' + esc(d.note) + "</textarea></label>";
    else h += '<button class="linkbtn" style="align-self:flex-start" data-action="e-note-show">+ Add a note</button>';
    if (d.invoiceId) { var inv = invoice(d.invoiceId); if (inv) h += '<p class="note">This is already on invoice No. ' + esc(inv.number) + ". Changes here also change that invoice record's total.</p>"; }
    if (d.error) h += '<p class="note">' + esc(d.error) + "</p>";
    h += '<div class="actions">' + (d.id ? '<button class="btn danger' + (d.armDelete ? " armed" : "") + '" data-action="e-delete">' + (d.armDelete ? "Tap again to delete" : "Delete") + "</button>" : "") +
      '<button class="btn primary" data-action="e-save">Save</button></div></div>';
    return h;
  }
  function readEntryInputs() {
    var d = sheet.data, g = function (id) { var el = document.getElementById(id); return el ? el.value : null; };
    if (g("e-date")) d.date = g("e-date");
    if (g("e-qty") != null) d.qty = g("e-qty");
    if (g("e-desc") != null) d.description = g("e-desc");
    if (g("e-amount") != null) d.amount = g("e-amount");
    if (g("e-note") != null) d.note = g("e-note");
    var bo = document.getElementById("e-billothers"); if (bo) d.billOthers = bo.checked;
  }
  function saveEntry() {
    readEntryInputs();
    var d = sheet.data, c = client(d.clientId);
    if (!c) { d.error = "Pick a client."; renderSheet(); return; }
    if (!d.date) { d.error = "Pick a date."; renderSheet(); return; }
    var e = d.id ? state.entries.find(function (x) { return x.id === d.id; }) : { id: uid(), createdAt: Date.now() };
    e.clientId = c.id; e.date = d.date; e.kind = d.kind; e.note = d.note || "";
    if (d.kind === "care") {
      var r = c.rates.find(function (x) { return x.id === d.rateId; });
      if (!r) { d.error = "Pick the type of care. If there are none, add a rate to this client first."; renderSheet(); return; }
      var q = parseFloat(d.qty);
      if (!(q > 0)) { d.error = "Enter how long, more than 0."; renderSheet(); return; }
      var keepPrice = d.id && e.rateId === r.id && e.price != null;
      e.rateId = r.id; e.label = r.label; e.unit = r.unit; if (!keepPrice) e.price = r.price;
      e.qty = q; e.workedWith = d.workedWith.slice(); e.billOthers = !!(d.billOthers && d.workedWith.length);
      delete e.amount; delete e.description;
      if (e.photoId) { delPhoto(e.photoId); delete e.photoId; }
    } else {
      var a = parseFloat(d.amount);
      if (!(a > 0)) { d.error = "Enter the amount in pounds."; renderSheet(); return; }
      if (!String(d.description || "").trim()) { d.error = "Say what the extra was, e.g. Food shopping."; renderSheet(); return; }
      e.amount = Math.round(a * 100) / 100; e.description = d.description.trim();
      delete e.rateId; delete e.label; delete e.unit; delete e.price; delete e.qty; e.workedWith = []; e.billOthers = false;
      if (d.photoData) {
        if (e.photoId) delPhoto(e.photoId);
        e.photoId = uid();
        putPhoto(e.photoId, d.photoData).catch(function () { toast("Couldn't save the photo on this phone."); });
      } else if (!d.photoId && e.photoId) { delPhoto(e.photoId); delete e.photoId; }
    }
    if (!d.id) state.entries.push(e);
    if (e.invoiceId) recalcInvoice(e.invoiceId);
    save(); closeSheet();
    if (view.name === "week") view.week = weekStart(e.date);
    render(); toast(d.id ? "Saved" : "Logged " + (e.kind === "care" ? qtyText(e) : money(e.amount)) + " for " + c.name);
  }
  function recalcInvoice(invId) {
    var inv = invoice(invId); if (!inv) return;
    var es = state.entries.filter(function (e) { return e.invoiceId === invId; });
    inv.lines = invoiceLines(es);
    inv.total = Math.round(inv.lines.reduce(function (a, l) { return a + l.total; }, 0) * 100) / 100;
  }

  // Client sheet

  function readClientInputs() {

  function saveClient() {
    readClientInputs();

    render(); toast("Saved " + c.name);
  }

  // Mark-invoiced sheet

  function readInvoiceInputs() {

  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && document.getElementById("photo-root").innerHTML) { closeViewer(); return; }
    if (ev.key === "Escape" && sheet) closeSheet();
    if (ev.key === "Enter" && ev.target.id === "carer-new") { ev.preventDefault(); document.querySelector('[data-action="carer-add"]').click(); }
    if (ev.key === "Enter" && ev.target.id === "e-carer-new") { ev.preventDefault(); document.querySelector('[data-action="e-with-save"]').click(); }
  });
  function shareBackup() {
    var text = sheet.data.text, name = "kas-care-hours-backup-" + today() + ".json";
    try {
      var file = new File([text], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: "Care hours backup" }).catch(function () {});
        return;
      }
    } catch (e) {}
    try {
      var url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
      var a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      toast("Backup saved to your downloads");
    } catch (e) { toast("Couldn't share a file here. Use Copy backup as text."); }
  }

  load();
  render();
  if (syncAvailable() && sync.connected && tokenValid()) runSync();
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && syncAvailable() && sync.connected && tokenValid() && (sync.dirty || Date.now() - (sync.lastSync || 0) > 300000)) runSync();
  });
})();
</script>
